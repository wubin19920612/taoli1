server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress only public quote JSON; stream and account/control routes keep
  # their existing proxy behavior. Query strings pass through unchanged.
  location ~ ^/api/(opportunities|markets|health)$ {
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_buffers 8 4k;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    try_files $uri $uri/ /index.html;
  }
}
